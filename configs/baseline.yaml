# Configuração do baseline LeNet-5 FP32 / CIFAR-10.
# Os valores são uma configuração inicial CANDIDATA (decisão experimental
# própria do projeto), não resultados previamente validados nem hiperparâmetros
# extraídos dos artigos de referência.

experiment:
  name: lenet5_cifar10_baseline
  seed: 42                 # semente base (usada quando `seeds` não é definido)
  repetitions: 5
  # Sementes explícitas de cada repetição. Cada uma varia a inicialização dos
  # pesos e a ordem de embaralhamento do treino.
  seeds: [42, 123, 456, 789, 1024]
  output_dir: experiments/baseline

model:
  architecture: lenet5
  input_channels: 3
  num_classes: 10
  precision: float32

dataset:
  name: cifar10
  data_dir: data
  download: true
  train_size: 45000
  validation_size: 5000
  test_size: 10000
  # Semente da divisão treino/validação. É FIXA entre as repetições, para que
  # todas usem exatamente os mesmos conjuntos de treino e validação.
  split_seed: 42
  stratified: true
  normalize: true          # média/desvio por canal calculados só no treino (45k)
  augmentation: false
  num_workers: 0           # dados já ficam pré-processados em memória

training:
  epochs: 50
  batch_size: 128
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0005     # Adam com penalização L2 acoplada (torch.optim.Adam)
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  loss: cross_entropy
  scheduler: reduce_on_plateau
  # Parâmetros de torch.optim.lr_scheduler.ReduceLROnPlateau, monitorando a
  # perda de VALIDAÇÃO ao final de cada época:
  scheduler_params:
    mode: min              # a perda de validação deve diminuir
    factor: 0.5            # nova_lr = lr * factor
    patience: 5            # épocas sem melhora antes de reduzir a LR
    threshold: 1.0e-4      # melhora mínima considerada significativa
    threshold_mode: rel    # limiar relativo ao melhor valor
    cooldown: 0            # épocas de espera após uma redução
    min_lr: 1.0e-6         # limite inferior da LR
  early_stopping: false
  # early_stopping_patience: 10   # obrigatório se early_stopping: true
  checkpoint_metric: val_loss     # melhor checkpoint = menor perda de validação
  deterministic: true

evaluation:
  batch_size: 128
  latency_batch_sizes: [1, 128]
  warmup_iterations: 50
  benchmark_iterations: 200

environment:
  device: auto             # auto | cpu | cuda | cuda:N
  precision: float32
